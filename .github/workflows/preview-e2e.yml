# preview-e2e - walks the flows against a Vercel Preview deployment of main, nightly and by hand (Afik, 16.10.2026:
# automated Preview E2E; 20.10.2026: nightly instead of every deployment). Real Supabase Auth, the real server and the
# deployed web app, on Chrome at 375x812 and 1280x800. Never against Production.
#
# Triggers: schedule (nightly at 22:47 UTC, after the nightly CI run) and workflow_dispatch, from the default branch only.
# Not on every push to main: each run may cost a Vercel deployment.
#
# How the Preview is found: main deploys as Production, and Vercel builds a Preview only for ready/** branches
# (vercel.json). Job `deployment` commits main's tree as a new child of ready/nightly and of main, and pushes it (a plain push with the default
# GITHUB_TOKEN, never forced; a rejected push fails the run): Vercel builds no Preview of main's own commit, already Production. If ready/nightly already holds main's tree, nothing is
# pushed and that commit's existing Preview deployment is used. It then polls the deployments API for a deployment of
# that commit with environment Preview, created by vercel[bot], whose latest status is success, for up to 15 minutes.
# Only this job can write (contents: write, to push the branch; deployments: read); it runs git and gh only, no code
# from the repository.
#
# Job `e2e` (checks preview-e2e (mobile-375) and preview-e2e (desktop-1280)) checks out that commit with a read-only token.
# The deployment URL reaches the guard (tools/preview-e2e-url-guard.ts) through env and is checked before anything else runs: only a unique Preview
# deployment host is accepted. The Playwright step receives only the checked URL. The Vercel bypass secret is in the env
# of that one step; the flows get only a generated user and that URL, and the bypass goes to the deployment host only
# (e2e-preview/support/bypass.ts).
#
# Two runners at once (Afik 24.10.2026, §14.2): job `e2e` is a matrix over the two Playwright projects (mobile-375, desktop-1280),
# fail-fast off, each runner walking only its own project (`--project`), with its own staff setup (only its viewport's Moderator), its
# own staff file, report, failure-context artifact and credential removal. Why the two runners do not collide:
# - users: every generated email is nestly-e2e-<run>-<attempt>-<16 random hex>@gmail.com (support/test-user.ts), so the two runners'
#   sign-ups and the two setups' inserts never meet on auth.users' unique email; each flow's names and titles carry the user's random
#   part or random letters, so a search finds only its own runner's rows.
# - staff: each setup inserts one Moderator in its own transaction (fresh random ids; no shared row is updated), into its own
#   runner-temp file; the flows read the Moderator of their own project only (support/staff-user.ts).
# - recovery: the failed-attempt counter is per user and per process; the IP limit (10 in 15 min) is not reached even if both runners
#   leave through one address (2 projects x 3 deliberate failures, as before, when the two ran one after the other).
# - shared Preview rows: the Directory's one promoted slot is matched by the page's filters, and each project's Professional is in its
#   own field (monetization.flow.ts PRO_BY_PROJECT), so the two promotions never compete; Marketplace promotions are matched by a
#   per-user title.
# - cleanup: workflow_run fires once, when the whole run (both runners) completes, and deletes every user of that run and attempt
#   (by the email prefix), both projects' together. A rerun of one failed runner is a new attempt with its own prefix and its own
#   cleanup.
# - one run at a time (concurrency group preview-e2e, at the workflow level): two runs never share the Preview's database.
#
# Cleanup is NOT here: .github/workflows/preview-e2e-cleanup.yml runs after this workflow completes (workflow_run, the
# default branch's code). Afik 23.10: one trusted-main setup step may create temporary Preview Moderators.
# Only that step receives PREVIEW_DB_ADMIN_URL; browser flows never receive database credentials.

name: preview-e2e

on:
  # Nightly at 22:47 UTC (about 01:47 in Israel).
  schedule:
    - cron: '47 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-e2e
  cancel-in-progress: false

jobs:
  deployment:
    name: preview-deployment
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      deployments: read
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      target_url: ${{ steps.wait.outputs.target_url }}
    steps:
      # Full history, so a fast-forward of ready/nightly can be checked. The token stays in the checkout for the push;
      # this job runs no repository code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - name: Put main's tree on ready/nightly as a new commit
        id: candidate
        run: |
          set -euo pipefail
          main_sha="$(git rev-parse HEAD)"
          # `case` tests the whole value (grep would test line by line).
          case "${main_sha}" in
            *[!0-9a-f]*|'') echo "::error::main's commit id could not be read"; exit 1 ;;
          esac
          if [ "${#main_sha}" -ne 40 ]; then
            echo "::error::main's commit id could not be read"
            exit 1
          fi
          tree="$(git rev-parse "${main_sha}^{tree}")"
          current="$(git ls-remote origin refs/heads/ready/nightly | cut -f1)"
          parents=()
          if [ -n "${current}" ]; then
            git fetch --no-tags origin refs/heads/ready/nightly
            # A nightly commit of main's current tree already exists: its Preview deployment is used. Not when the branch
            # is at main's own commit: Vercel deployed that commit as Production and builds no Preview of it (21.10.2026).
            if [ "${current}" != "${main_sha}" ] && [ "$(git rev-parse "${current}^{tree}")" = "${tree}" ]; then
              echo "sha=${current}" >> "${GITHUB_OUTPUT}"
              echo "ready/nightly (${current}) already holds main's tree: nothing pushed, that commit's Preview deployment is used"
              exit 0
            fi
            parents+=(-p "${current}")
          fi
          parents+=(-p "${main_sha}")
          # A new commit with main's exact tree, child of the branch's tip (so the push is a fast-forward) and of main.
          # Vercel builds a Preview only of a commit it has not deployed; main's own commit is already Production.
          sha="$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "${tree}" "${parents[@]}" -m "nightly: main at ${main_sha}")"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          # A plain push: GitHub refuses it unless it is a fast-forward (or creates the branch). Never forced.
          if ! git push origin "${sha}:refs/heads/ready/nightly"; then
            echo "::error::the push to ready/nightly was rejected (a branch rule). It is never force-pushed: delete the branch by hand, then run this workflow again."
            exit 1
          fi
          echo "ready/nightly now points at ${sha} (main's tree at ${main_sha})"
      - name: Wait for the Preview deployment of that commit
        id: wait
        timeout-minutes: 17
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          case "${SHA}" in
            *[!0-9a-f]*|'') echo "::error::no commit id to look for"; exit 1 ;;
          esac
          if [ "${#SHA}" -ne 40 ]; then
            echo "::error::no commit id to look for"
            exit 1
          fi
          # Preview only, by vercel[bot], for this exact commit: main's own deployment of the same commit is Production
          # and never matches. The API filters by query, and the same conditions are checked again on each row.
          select=".[] | select(.sha == \"${SHA}\" and .environment == \"Preview\" and .production_environment != true and .creator.login == \"vercel[bot]\") | .id"
          deadline=$(( $(date +%s) + 15 * 60 ))
          while :; do
            if ! ids="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/deployments" -f sha="${SHA}" -f environment=Preview -f per_page=30 --jq "${select}")"; then
              echo "::warning::the deployments API did not answer; trying again"
              ids=""
            fi
            url=""
            for id in ${ids}; do
              case "${id}" in *[!0-9]*|'') continue ;; esac
              # Statuses come newest first: the deployment counts only when its latest status is success.
              if ! found="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=1" --jq '.[0] | select(.state == "success") | (.target_url // .environment_url // "")')"; then
                found=""
              fi
              if [ -n "${found}" ]; then
                url="${found}"
                break
              fi
            done
            if [ -n "${url}" ]; then
              # A coarse character check of the whole value (no newline, no space), so it cannot break the output file;
              # the e2e job's guard decides whether it is a Preview deployment host.
              case "${url}" in
                *[!A-Za-z0-9:/._-]*) echo "::error::the deployment URL has unexpected characters"; exit 1 ;;
              esac
              echo "target_url=${url}" >> "${GITHUB_OUTPUT}"
              echo "found a successful Preview deployment of ${SHA} by vercel[bot]"
              exit 0
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::no successful Preview deployment by vercel[bot] for ${SHA} within 15 minutes"
              exit 1
            fi
            sleep 20
          done

  e2e:
    name: preview-e2e (${{ matrix.project }})
    needs: deployment
    environment: preview-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One runner per Playwright project, at the same time (Afik 24.10, §14.2). Not fail-fast: one viewport's failure never cancels the
    # other's run (a cancelled flow would leave its users half-made; the cleanup deletes them either way).
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-375, desktop-1280]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.deployment.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check the deployment URL
        id: guard
        env:
          TARGET_URL: ${{ needs.deployment.outputs.target_url }}
        run: node tools/preview-e2e-url-guard.ts
      # The database credential is used before any code of the tested tree is installed or run: the trusted main harness is
      # checked out and gets its own install with lifecycle scripts off, and the setup step runs with NODE_OPTIONS cleared,
      # so no dependency script of the tested tree can reach that step's environment, $GITHUB_ENV or its process.
      - name: Check out trusted main harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .preview-harness
          persist-credentials: false
      - name: Install the harness (no lifecycle scripts)
        working-directory: .preview-harness
        run: npm ci --ignore-scripts
      # Only this runner's project's Moderator (the other runner makes its own), in a file named for the project.
      - name: Prepare the temporary Preview Moderator
        timeout-minutes: 2
        env:
          NODE_OPTIONS: ''
          PREVIEW_DB_ADMIN_URL: ${{ secrets.PREVIEW_DB_ADMIN_URL }}
          PREVIEW_E2E_PROJECT: ${{ matrix.project }}
          PREVIEW_E2E_STAFF_FILE: ${{ runner.temp }}/preview-e2e-staff-${{ matrix.project }}.json
        run: node .preview-harness/tools/preview-e2e-staff-cli.ts
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      # 78 flows (both projects) took 10.1 min on 24.10 and a slow Preview 12 min: one project is about half of that; 12 leaves room for a
      # slow Preview serving both runners at once
      - name: Walk the flows on the preview
        timeout-minutes: 12
        env:
          PREVIEW_E2E_BASE_URL: ${{ steps.guard.outputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PREVIEW_E2E_PROJECT: ${{ matrix.project }}
          PREVIEW_E2E_REPORT_FILE: ${{ runner.temp }}/preview-e2e-report-${{ matrix.project }}.json
          PREVIEW_E2E_STAFF_FILE: ${{ runner.temp }}/preview-e2e-staff-${{ matrix.project }}.json
        run: npx playwright test -c e2e-preview/playwright.config.ts --project="${PREVIEW_E2E_PROJECT}"
      # On failure only: the error-context.md of each failed test (the page's accessibility snapshot at the failure). Trace,
      # video and screenshots stay off (playwright.config.ts), since the Vercel bypass header or a typed password could land
      # in them. The trusted harness copies each snapshot with every form-field value redacted and every occurrence of a
      # temporary staff password or recovery answer replaced, so it runs while the staff file still exists; nothing else is
      # uploaded. The bypass secret is in the env of the Playwright step only, never in the page.
      - name: Collect the failure context (values redacted)
        if: failure()
        env:
          NODE_OPTIONS: ''
          PREVIEW_E2E_STAFF_FILE: ${{ runner.temp }}/preview-e2e-staff-${{ matrix.project }}.json
        run: node .preview-harness/tools/preview-e2e-failure-context-cli.ts
      - name: Remove temporary staff credentials
        if: always()
        env:
          NODE_OPTIONS: ''
          PREVIEW_E2E_STAFF_FILE: ${{ runner.temp }}/preview-e2e-staff-${{ matrix.project }}.json
        run: node -e "require('node:fs').rmSync(process.env.PREVIEW_E2E_STAFF_FILE, { force:true })"
      - name: Upload the failure context
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # one artifact per project: two uploads under one name would collide in the run
          name: preview-e2e-failure-context-${{ matrix.project }}
          path: ${{ runner.temp }}/preview-e2e-failures
          if-no-files-found: ignore
          retention-days: 7
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PROJECT: ${{ matrix.project }}
          REPORT_FILE: ${{ runner.temp }}/preview-e2e-report-${{ matrix.project }}.json
        run: |
          {
            echo "preview-e2e ${PROJECT}: ${JOB_STATUS} (run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT})"
            # Per project, counts only: the report is read for status, never printed, and is not uploaded.
            if [ -f "${REPORT_FILE}" ]; then
              jq -r '[.. | objects | select(has("projectName") and has("results"))] | group_by(.projectName)[] | "- \(.[0].projectName): \([.[] | select(.status == "expected")] | length) passed, \([.[] | select(.status != "expected" and .status != "skipped")] | length) failed"' "${REPORT_FILE}" || echo "- the report could not be read"
            else
              echo "- no report (the run stopped before the tests)"
            fi
            echo "cleanup of both projects' test users runs once, after both runners, in the follow-up workflow preview-e2e-cleanup"
          } >> "${GITHUB_STEP_SUMMARY}"
