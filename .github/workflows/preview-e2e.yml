# preview-e2e - walks a flow against every successful Vercel Preview deployment (Afik, 16.10.2026: automated Preview
# E2E; .work/preview-e2e/spec.md). Real Supabase Auth, the real server and the deployed web app, on Chrome at 375x812
# and 1280x800.
#
# Trigger: deployment_status only; the job runs when the state is success, the environment is Preview and the status
# was posted by vercel[bot]. The result is this run's own check on the deployment sha (Gate 1 amendment A3); no extra
# permission until a real run shows it missing from the pull request.
#
# Secrets: the Vercel bypass secret is in the env of the one step that sends it. The deployment URL reaches the guard
# through env, is checked before anything else runs, and the Playwright step receives only the checked URL. The flows
# get only a generated user and that URL; the bypass goes to the deployment host only (e2e-preview/support/bypass.ts).
#
# Cleanup (DR-E1, Afik 17.10.2026, option 1) is NOT here: .github/workflows/preview-e2e-cleanup.yml runs after this workflow
# (workflow_run, the default branch's code). This job holds no environment and never sees PREVIEW_DB_ADMIN_URL.

name: preview-e2e

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: preview-e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: preview-e2e
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview' && github.event.deployment_status.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check the deployment URL
        id: guard
        env:
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: node tools/preview-e2e-url-guard.ts
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Walk the flows on the preview
        timeout-minutes: 12
        env:
          PREVIEW_E2E_BASE_URL: ${{ steps.guard.outputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PREVIEW_E2E_REPORT_FILE: ${{ runner.temp }}/preview-e2e-report.json
        run: npx playwright test -c e2e-preview/playwright.config.ts
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          REPORT_FILE: ${{ runner.temp }}/preview-e2e-report.json
        run: |
          {
            echo "preview-e2e: ${JOB_STATUS} (run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT})"
            # Per project, counts only: the report is read for status, never printed, and is not uploaded.
            if [ -f "${REPORT_FILE}" ]; then
              jq -r '[.. | objects | select(has("projectName") and has("results"))] | group_by(.projectName)[] | "- \(.[0].projectName): \([.[] | select(.status == "expected")] | length) passed, \([.[] | select(.status != "expected" and .status != "skipped")] | length) failed"' "${REPORT_FILE}" || echo "- the report could not be read"
            else
              echo "- no report (the run stopped before the tests)"
            fi
            echo "cleanup of the test users runs in the follow-up workflow preview-e2e-cleanup"
          } >> "${GITHUB_STEP_SUMMARY}"
