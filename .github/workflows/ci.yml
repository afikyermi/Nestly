# CI for Nestly (WORKPLAN 7.1). Public repo: no secrets are used or needed.
# Locally, `npm run ci` runs typecheck, lint, tokens:check, check:stories, test and build in this order.
# `build-storybook` and `test:browser` are their own jobs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Read-only, public package registry; no token is configured.
  NPM_CONFIG_FUND: "false"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The generated token CSS is committed; it must equal what the source builds (UI wave 1).
      - run: npm run tokens:check
      # Every component has stories for all of its states (UI wave 1, criterion 13).
      - run: npm run check:stories

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  # The static gallery builds (UI wave 1, criterion 12). No Chromatic: plain files.
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build-storybook

  # Playwright on Chrome and Edge against the built gallery (SRS NFR-QA-001). Passes with no
  # tests while the suite is empty.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium msedge
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  # Database checks are NOT built yet. `supabase/` does not exist; it belongs to
  # DATA ARCHITECT and is created with the first migration. They join this
  # workflow in that same change (WORKPLAN 7.1, "בדיקות מסד"):
  #   - every table has an RLS policy and FORCE ROW LEVEL SECURITY
  #   - no table is owned by `app_server`
  #   - every view is `security_invoker`
  #   - a pgTAP test that a query without an identity fails
  #   - the tests run as the `app_server` role
  #
  # db:
  #   runs-on: ubuntu-latest
  #   steps: [checkout, supabase/setup-cli, `supabase db start`, `supabase test db`]
