# CI for Nestly. Public repo: no secrets are used or needed.
# Locally, `npm run ci` runs typecheck, lint, tokens:check, check:stories, test and build in this order.
#
# What runs when:
# - pull_request: typecheck, lint, test, build, audit, schema-gate, `storybook` (when the web app, the shared package or
#   their tooling changed), `db` (when supabase/, apps/server/, packages/shared/ or their config changed), and
#   `browser-changed`: only the e2e specs the pull request added or changed, in Chrome, skipped when it changed none. If
#   the changed files cannot be read, the whole Chrome suite runs instead, in `browser` (fail-safe).
# - push to main and the nightly schedule: everything above except schema-gate and `browser-changed`, and `browser`: the
#   whole Chrome suite in eight shards, without the visual specs (*.visual.spec.ts).
# - workflow_dispatch (by hand): as main, but `browser` includes the visual specs, and `browser-edge` runs the Edge suite
#   in eight shards. Edge runs on no other event.
# The job `changes` decides what a pull request needs; `db` needs Docker and runs in CI only.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly at 22:17 UTC (about 01:17 in Israel), on the default branch.
  schedule:
    - cron: '17 22 * * *'
  # By hand: the whole workflow, the visual specs and the Edge job `browser-edge` included.
  workflow_dispatch:

permissions:
  contents: read

# One queue per ref and event, so a push to main never replaces a queued nightly or manual run (or the other way round).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Read-only, public package registry; no token is configured.
  NPM_CONFIG_FUND: "false"

jobs:
  # Which jobs a pull request needs (Afik 14.10, "CI once per part"). A skipped job still reports, as "skipped", which a
  # required check counts as passing: so the filter is a job-level `if`, never a workflow-level `paths:`. Fail-safe:
  # every event other than a pull request, and any pull request whose changed files cannot be read, runs everything
  # (browser=full). Be conservative: a missed run is worse than an extra one.
  # Outputs: web and db (true/false); browser = full (the whole Chrome suite, sharded), changed (only `specs`) or none;
  # specs = the added or changed e2e/**/*.spec.ts files, space-separated, each made only of [A-Za-z0-9._/-].
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
      db: ${{ steps.filter.outputs.db }}
      browser: ${{ steps.filter.outputs.browser }}
      specs: ${{ steps.filter.outputs.specs }}
    steps:
      # A pull request is checked out as a merge commit: HEAD^1 is the base, so the diff is what the merge would change.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          web=true
          db=true
          browser=full
          specs=""
          if [ "${EVENT_NAME}" = pull_request ]; then
            list="${RUNNER_TEMP}/changed-files"
            # -z: NUL-separated, never quoted or escaped, so a path with odd characters is read as it is. It goes to a
            # file because $(...) drops NULs. --no-renames lists both paths of a move (a file moved out of apps/web).
            # git's exit status decides whether the list is trustworthy.
            if git rev-parse --verify --quiet 'HEAD^2' >/dev/null && git diff -z --no-renames --name-only 'HEAD^1' HEAD > "${list}"; then
              web=false
              db=false
              browser=none
              unsafe=false
              while IFS= read -r -d '' file; do
                # `case` takes the first match, so what both jobs need sits on one line. A path that starts with a
                # quote should not occur with -z; if one does, run everything.
                case "${file}" in
                  '"'*|packages/shared/*|package-lock.json|tsconfig.base.json|.nvmrc|.github/workflows/ci.yml) web=true; db=true ;;
                  apps/web/*|e2e/*|playwright.config.ts|tsconfig.playwright.json|package.json) web=true ;;
                  tools/serve-static.mjs|tools/build-design-tokens.js|tools/check-stories.mjs) web=true ;;
                  supabase/*|apps/server/*) db=true ;;
                esac
                # A spec the merge still has (added or changed; a deleted one has nothing to run). Its path is passed
                # to Playwright word by word, so only plain characters are allowed; any other runs the whole suite.
                case "${file}" in
                  e2e/*.spec.ts)
                    if [ -f "${file}" ]; then
                      case "${file}" in
                        *[!A-Za-z0-9._/-]*) unsafe=true ;;
                        *) specs="${specs:+${specs} }${file}" ;;
                      esac
                    fi
                    ;;
                esac
              done < "${list}"
              echo "changed files:"
              tr '\0' '\n' < "${list}"
              if [ "${unsafe}" = true ]; then
                echo "::notice::a changed spec has a path with unusual characters: running the whole Chrome suite"
                browser=full
                specs=""
              elif [ -n "${specs}" ]; then
                browser=changed
              fi
            else
              echo "::notice::could not read the changed files: running everything"
            fi
          fi
          echo "web=${web}" >> "${GITHUB_OUTPUT}"
          echo "db=${db}" >> "${GITHUB_OUTPUT}"
          echo "browser=${browser}" >> "${GITHUB_OUTPUT}"
          echo "specs=${specs}" >> "${GITHUB_OUTPUT}"
          echo "storybook runs: ${web}; db runs: ${db}; browser: ${browser} ${specs}"

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Line budgets for always-read files and code outside the ESLint caps.
      - run: npm run check:budgets
      # The generated token CSS is committed; it must equal what the source builds.
      - run: npm run tokens:check
      # Every component has stories for all of its states.
      - run: npm run check:stories

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  # The static gallery builds. No Chromatic: plain files.
  storybook:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build-storybook

  # The whole Chrome suite against the built gallery and the e2e app build: on push to main, nightly, by hand, and on a
  # pull request whose changed files could not be read (changes: browser=full). Desktop and phone (the specs set their own
  # viewports). On push and schedule E2E_SKIP_VISUAL=true leaves out *.visual.spec.ts (playwright.config.ts); by hand
  # and on the pull-request fail-safe the blocking visual regression runs too. Eight shards in parallel, each its own
  # runner, on e2e stubs only. Playwright splits shards by test count in file order and keeps a non-parallel file in one
  # worker; e2e/a11y.spec.ts is parallel, so its tests share the shard's workers. Timeouts by test type and the CI
  # globalTimeout, two minutes or more under timeout-minutes: playwright.config.ts, guarded by tools/ci-browser.test.mjs.
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [chrome]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The cache key is the Playwright version in the lockfile; the install below is idempotent and fills what is missing.
      - id: playwright
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Only this job's browser; Edge is installed in `browser-edge`.
      - run: npx playwright install --with-deps chrome
      - run: npm run build-storybook
      - env:
          E2E_SKIP_VISUAL: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Pull requests: only the e2e specs the pull request added or changed (changes: browser=changed), in Chrome, in one job.
  # Skipped when it changed no spec. The gallery is built here too: Playwright starts both web servers for any spec.
  browser-changed:
    needs: changes
    if: needs.changes.outputs.browser == 'changed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: playwright
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chrome
      - run: npm run build-storybook
      - name: The changed specs in Chrome
        env:
          SPECS: ${{ needs.changes.outputs.specs }}
        run: |
          set -euf
          # The changes job admits only plain paths; checked again here, since each word becomes an argument.
          case "${SPECS}" in
            ''|*[!A-Za-z0-9._/\ -]*) echo "::error::the changed-spec list is empty or has unexpected characters"; exit 1 ;;
          esac
          echo "specs: ${SPECS}"
          # Word splitting is intended: one argument per spec file (globbing is off, set -f).
          # shellcheck disable=SC2086
          npx playwright test --project=chrome ${SPECS}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-chrome-changed
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Edge (SRS NFR-QA-001) runs only by hand (workflow_dispatch): never on a pull request, a push to main or the nightly
  # schedule. The visual regression is Chrome only (the edge project ignores *.visual.spec.ts). Eight shards, as Chrome (five let the heaviest, the alphabetical a-j app-flow files, run 12 min):
  # three shards held ~1,050 tests each and hit the CI globalTimeout (playwright.config.ts).
  browser-edge:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: playwright
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps msedge
      - run: npm run build-storybook
      - run: npx playwright test --project=edge --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-edge-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # P6 (schema before code): a pull request that adds a migration carries no product code; one that changes product code
  # waits until every migration in its tree is applied in production (tools/schema-gate.mjs). Read only: it reads the
  # migrate runs through the API and never dispatches. After migrate's db-production job succeeded on main, re-run this
  # job once on the PR. It runs the BASE commit's copy of the gate, so a pull request never judges itself;
  # only the pull request that adds the gate runs its own copy. part-status counts a missing schema-gate as a blocker and,
  # from the PR's file list, blocks product code changed together with this job or the gate. Recovery if a broken gate
  # reaches main (every PR then fails here, its fix included): Afik merges that one gate-only fix by hand; never switch
  # this job to the pull request's copy.
  schema-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Schema before code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gate="${RUNNER_TEMP}/schema-gate.mjs"
          if git cat-file -e 'HEAD^1:tools/schema-gate.mjs'; then
            git show 'HEAD^1:tools/schema-gate.mjs' > "${gate}"
          else
            echo "::notice::the base has no schema gate yet (the pull request that adds it): running this pull request's copy"
            cp tools/schema-gate.mjs "${gate}"
          fi
          node "${gate}"

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  # A disposable database, built from scratch on every run (I1 F1.1 part a, spec criteria 1-4, 6, 7). No GitHub secret
  # and no environment: every password is random per run, masked, and dies with the runner. Nothing here can reach nestly-preview or nestly-prod.
  # Order: pinned auth functions -> their hash check -> image preflight -> bootstrap step 1 -> migrations as app_owner
  # (the newest up -> down -> up) -> bootstrap step 2 -> Drizzle drift check (part b criteria 8-20) -> the gate's
  # fire harness as postgres -> RLS gate and pgTAP as app_server.
  db:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The image the pinned CLI itself uses; PostgreSQL 17.11, the minor of nestly-preview and nestly-prod.
      SUPABASE_POSTGRES_IMAGE: supabase/postgres:17.11.0.004
      # The version T5 verified over the session pooler (tools/probes/t5.mjs). The same pin is in migrate.yml.
      SUPABASE_CLI_VERSION: 2.120.0
      PGHOST: 127.0.0.1
      PGPORT: "54322"
      PGDATABASE: postgres
      PGCONNECT_TIMEOUT: "10"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # HEAD^1 is the base for the P6 expand check (last db step).
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The workspace packages: the Drizzle schema and its drift check (criterion 20).
      - run: npm ci

      - name: Install psql, pg_prove and the Supabase CLI (pinned)
        run: |
          set -eu
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-client libtap-parser-sourcehandler-pgtap-perl
          # Integrity-pinned: tools/supabase-cli/package-lock.json (sha512), npm ci --ignore-scripts.
          bash tools/install-supabase-cli.sh

      - name: Generate per-run passwords
        run: |
          set -eu
          owner=""
          server=""
          for name in CI_POSTGRES_PASSWORD CI_APP_OWNER_PASSWORD CI_APP_SERVER_PASSWORD CI_JWT_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "${GITHUB_ENV}"
            if [ "${name}" = CI_APP_OWNER_PASSWORD ]; then owner="${value}"; fi
            if [ "${name}" = CI_APP_SERVER_PASSWORD ]; then server="${value}"; fi
          done
          url="postgresql://app_owner:${owner}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          echo "::add-mask::${url}"
          echo "CI_APP_OWNER_DB_URL=${url}" >> "${GITHUB_ENV}"
          # The request server's connection (part c): app_server, as in every real environment (data-model rule 2).
          url="postgresql://app_server:${server}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          echo "::add-mask::${url}"
          echo "CI_APP_SERVER_DB_URL=${url}" >> "${GITHUB_ENV}"

      - name: Start the disposable database
        run: |
          set -eu
          supabase --version
          docker run --detach --name nestly-ci-db \
            --publish "127.0.0.1:${PGPORT}:5432" \
            --env POSTGRES_PASSWORD="${CI_POSTGRES_PASSWORD}" \
            --env JWT_SECRET="${CI_JWT_SECRET}" \
            --env JWT_EXP=3600 \
            "${SUPABASE_POSTGRES_IMAGE}"
          # Ready = three logins in a row as postgres (the image restarts the server after its init scripts).
          ok=0
          for _ in $(seq 1 120); do
            if PGUSER=postgres PGPASSWORD="${CI_POSTGRES_PASSWORD}" psql -X -q -t -c 'select 1' >/dev/null 2>&1; then
              ok=$((ok + 1))
              if [ "${ok}" -ge 3 ]; then exit 0; fi
            else
              ok=0
            fi
            sleep 2
          done
          echo "::error::the disposable database did not become ready"
          exit 1

      # The image's own auth.uid()/auth.role() do not read request.jwt.claims; install the deployed definitions, pinned
      # and hash-checked (supabase/ci/auth-functions-check.sql). supabase_admin is the image's superuser, used
      # for this one setup step of a disposable database only.
      - name: Install the pinned auth functions as supabase_admin
        env:
          PGUSER: supabase_admin
          PGPASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
        run: psql -X -q -v ON_ERROR_STOP=1 -f supabase/ci/auth-functions.sql

      - name: Check the auth functions match the pinned hashes
        env:
          PGUSER: postgres
          PGPASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
        run: psql -X -q -v ON_ERROR_STOP=1 -f supabase/ci/auth-functions-check.sql

      - name: Check the image provides what the suite assumes
        env:
          PGUSER: postgres
          PGPASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
        run: psql -X -q -v ON_ERROR_STOP=1 -f supabase/ci/image-preflight.sql

      - name: Bootstrap step 1 as postgres, then per-run passwords
        env:
          PGUSER: postgres
          PGPASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
        run: |
          set -eu
          psql -X -q -v ON_ERROR_STOP=1 -f supabase/bootstrap/01-roles.sql
          psql -X -q -v ON_ERROR_STOP=1 <<'SQL'
          \getenv owner_pw CI_APP_OWNER_PASSWORD
          \getenv server_pw CI_APP_SERVER_PASSWORD
          alter role app_owner  password :'owner_pw';
          alter role app_server password :'server_pw';
          SQL

      # Every migration as app_owner. The newest also goes up -> down -> up once (rollback rule): its down
      # script must return the database to the state before it, and the second up must give the database the first did.
      - name: Migrations as app_owner (supabase db push), the newest up -> down -> up
        env:
          PGUSER: postgres
          PGPASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
        run: |
          set -eu
          fingerprint() { psql -X -q -A -t -v ON_ERROR_STOP=1 -f supabase/ci/catalog-fingerprint.sql; }
          push() { supabase db push "$@" --db-url "${CI_APP_OWNER_DB_URL}" --yes --skip-vault --agent no; }
          fail() { echo "::error::$1"; exit 1; }
          mkdir -p supabase/migrations
          newest="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort | tail -n 1)"
          if [ -z "${newest}" ]; then
            push
            echo "::notice::no migration yet: up -> down -> up not run"
            exit 0
          fi
          name="$(basename "${newest}" .sql)"
          down="supabase/rollback/${name}.down.sql"
          [ -f "${down}" ] || fail "${newest} has no down script (${down})"
          older="${RUNNER_TEMP}/older"
          mkdir -p "${older}/supabase/migrations"
          for f in supabase/migrations/*.sql; do
            if [ "${f}" != "${newest}" ]; then cp "${f}" "${older}/supabase/migrations/"; fi
          done
          push --workdir "${older}"
          before="$(fingerprint)"
          push
          up="$(fingerprint)"
          [ "${up}" != "${before}" ] || fail "${name} changed nothing"
          psql "${CI_APP_OWNER_DB_URL}" -X -q -v ON_ERROR_STOP=1 -f "${down}"
          [ "$(fingerprint)" = "${before}" ] || fail "${down} did not return the database to its state before ${name}"
          push
          [ "$(fingerprint)" = "${up}" ] || fail "${name} applied again after its down script gave a different database"
          echo "${name}: up -> down -> up OK"

      - name: A second push with nothing pending changes nothing (criterion 6)
        env:
          PGUSER: postgres
          PGPASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
        run: |
          set -eu
          fingerprint() { psql -X -q -A -t -v ON_ERROR_STOP=1 -f supabase/ci/catalog-fingerprint.sql; }
          before="$(fingerprint)"
          supabase db push --db-url "${CI_APP_OWNER_DB_URL}" --yes --skip-vault --agent no
          after="$(fingerprint)"
          if [ "${before}" != "${after}" ]; then
            echo "::error::a push with nothing pending changed the database"
            exit 1
          fi

      - name: A migration whose last statement fails leaves nothing behind (criterion 7)
        env:
          PGUSER: postgres
          PGPASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
        run: |
          set -eu
          fingerprint() { psql -X -q -A -t -v ON_ERROR_STOP=1 -f supabase/ci/catalog-fingerprint.sql; }
          work="${RUNNER_TEMP}/atomicity"
          log="${RUNNER_TEMP}/atomicity.log"
          mkdir -p "${work}/supabase/migrations"
          for f in supabase/migrations/*.sql; do
            if [ -e "${f}" ]; then cp "${f}" "${work}/supabase/migrations/"; fi
          done
          cp supabase/ci/fixtures/99990101000000_atomicity_probe.sql "${work}/supabase/migrations/"
          before="$(fingerprint)"
          if supabase db push --workdir "${work}" --db-url "${CI_APP_OWNER_DB_URL}" --yes --skip-vault --agent no \
            > "${log}" 2>&1; then
            cat "${log}"
            echo "::error::the failing fixture migration was applied without an error"
            exit 1
          fi
          cat "${log}"
          if ! grep -qF 'atomicity probe: intended failure' "${log}"; then
            echo "::error::the push failed, but not on the fixture's last statement"
            exit 1
          fi
          after="$(fingerprint)"
          if [ "${before}" != "${after}" ]; then
            psql -X -q -A -t -v ON_ERROR_STOP=1 -c "select 'probe schema present: ' || exists (select 1 from pg_namespace where nspname = 'ci_atomicity_probe')"
            echo "::error::statements before the failing one were left behind: the CLI did not apply the migration atomically (the atomicity assumption of the migration tooling no longer holds)"
            exit 1
          fi

      # Criterion 9. Skipped only while no migration exists; once one does, a missing step 2 fails (finding 5).
      - name: Bootstrap step 2 as postgres, twice, then its check
        env:
          PGUSER: postgres
          PGPASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
        run: |
          set -eu
          step=supabase/bootstrap/02-anchor-fk.sql
          check=supabase/bootstrap/02-anchor-fk-check.sql
          if [ ! -f "${step}" ]; then
            if [ -n "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' 2>/dev/null)" ]; then
              echo "::error::${step} is missing, but supabase/migrations is not empty"
              exit 1
            fi
            echo "::notice::${step} does not exist and there is no migration yet: skipped"
            exit 0
          fi
          if [ ! -f "${check}" ]; then
            echo "::error::${check} is missing"
            exit 1
          fi
          fingerprint() { psql -X -q -A -t -v ON_ERROR_STOP=1 -f supabase/ci/catalog-fingerprint.sql; }
          psql -X -q -v ON_ERROR_STOP=1 -f "${step}"
          before="$(fingerprint)"
          psql -X -q -v ON_ERROR_STOP=1 -f "${step}"
          after="$(fingerprint)"
          if [ "${before}" != "${after}" ]; then
            echo "::error::a second run of bootstrap step 2 changed the database"
            exit 1
          fi
          result="$(psql -X -q -A -t -F ' | ' -v ON_ERROR_STOP=1 -f "${check}")"
          echo "ok | fk_exists | definition | on_delete | validated | users_owner | fks_to_auth"
          echo "${result}"
          case "${result}" in
            "t | "*) ;;
            *) echo "::error::02-anchor-fk-check.sql: ok is not true"; exit 1 ;;
          esac

      # Criterion 20. Every column the Drizzle schema names exists in the migrated database with the same type and
      # nullability. The catalog is read as postgres; the comparison is apps/server/scripts/db-drift.ts.
      - name: The Drizzle schema matches the migrated database (criterion 20)
        env:
          PGUSER: postgres
          PGPASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
        run: |
          set -eu
          catalog="${RUNNER_TEMP}/catalog-columns.json"
          psql -X -q -A -t -v ON_ERROR_STOP=1 -f supabase/ci/catalog-columns.sql -o "${catalog}"
          npm run db:drift -w @nestly/server -- "${catalog}"

      - name: pgTAP and the RLS gate as postgres (CI only), then test fixtures
        env:
          PGUSER: postgres
          PGPASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
        run: |
          set -eu
          psql -X -q -v ON_ERROR_STOP=1 -f supabase/ci/pgtap-setup.sql
          psql -X -q -v ON_ERROR_STOP=1 -f supabase/ci/rls-gate.sql
          # The checks app_server cannot fire from its own session, fired here and rolled back (criterion 4; part a
          # review findings 3-5). Each file raises, and fails this step, when the gate misses its violation.
          psql -X -q -v ON_ERROR_STOP=1 -f supabase/ci/rls-gate-fire.sql
          psql "${CI_APP_OWNER_DB_URL}" -X -q -v ON_ERROR_STOP=1 -f supabase/ci/rls-gate-fire-owner.sql
          # Fixture helpers that come with the tests (supabase/tests/setup/*.sql), in name order, if any.
          for f in supabase/tests/setup/*.sql; do
            if [ -e "${f}" ]; then psql -X -q -v ON_ERROR_STOP=1 -f "${f}"; fi
          done

      # The product-wide verdict: nestly, every other schema app_owner owns, public, and the CLI's history schema
      # (supabase/ci/rls-gate.sql, tests.rls_gate_product). nestly missing is itself a violation.
      - name: RLS gate on the product schemas as app_server (criterion 3)
        env:
          PGUSER: app_server
          PGPASSWORD: ${{ env.CI_APP_SERVER_PASSWORD }}
        run: |
          set -eu
          violations="$(psql -X -q -A -t -F ' ' -v ON_ERROR_STOP=1 \
            -c "select check_name, object from tests.rls_gate_product() order by 1, 2")"
          if [ -n "${violations}" ]; then
            while read -r check object; do
              echo "::error::RLS gate: ${check}: ${object}"
            done <<< "${violations}"
            exit 1
          fi
          echo "RLS gate: no violation in nestly, the schemas app_owner owns, public or the history schema"

      - name: pgTAP suite with pg_prove as app_server
        env:
          PGUSER: app_server
          PGPASSWORD: ${{ env.CI_APP_SERVER_PASSWORD }}
          PGOPTIONS: "-c search_path=pgtap,tests"
        run: |
          set -eu
          files="$(find supabase/tests -path supabase/tests/setup -prune -o -type f -name '*.sql' -print 2>/dev/null | sort)"
          if [ -z "${files}" ]; then
            echo "::error::no pgTAP test file under supabase/tests: the suite is missing"
            exit 1
          fi
          # Word splitting is intended: one argument per file, in name order.
          # shellcheck disable=SC2086
          pg_prove --host "${PGHOST}" --port "${PGPORT}" --dbname "${PGDATABASE}" --username app_server ${files}

      # Part c, criteria 23-26: the server's integration tests (apps/server/tests/db/) against this database, connected
      # as app_server through DATABASE_URL like a deployed function. The JWKS is served by the tests themselves (local
      # ES256 keys); nothing reaches Supabase Auth. Vitest fails when the folder holds no test file, on purpose.
      - name: Server integration tests as app_server (part c)
        env:
          DATABASE_URL: ${{ env.CI_APP_SERVER_DB_URL }}
          # Only migration-backfill tests (e.g. F2.3a c6) connect as app_owner, to roll back and re-apply the newest migration.
          OWNER_DATABASE_URL: ${{ env.CI_APP_OWNER_DB_URL }}
        run: npm run test:db -w @nestly/server

      # P6 (schema before code): a pull request that adds a migration must keep main's code working, because main is
      # deployed while the migration waits for production. main's own server integration tests run here, unchanged, on
      # this pull request's database (old code, expanded schema). Any other event, or no new migration: nothing to prove.
      - name: Main's server tests against this pull request's schema (P6 expand check)
        env:
          EVENT_NAME: ${{ github.event_name }}
          DATABASE_URL: ${{ env.CI_APP_SERVER_DB_URL }}
          OWNER_DATABASE_URL: ${{ env.CI_APP_OWNER_DB_URL }}
        run: |
          set -eu
          if [ "${EVENT_NAME}" != pull_request ]; then
            echo "::notice::not a pull request: the expand check runs on pull requests only"
            exit 0
          fi
          added="$(git diff --name-only --diff-filter=A 'HEAD^1' HEAD -- supabase/migrations)"
          if [ -z "${added}" ]; then
            echo "::notice::no new migration: the expand check is not needed"
            exit 0
          fi
          echo "new migrations:"
          echo "${added}"
          base="${RUNNER_TEMP}/base"
          git worktree add --detach "${base}" 'HEAD^1'
          cd "${base}"
          npm ci
          npm run test:db -w @nestly/server

      - name: Database log on failure
        if: failure()
        run: docker logs --tail 200 nestly-ci-db 2>&1 || true
