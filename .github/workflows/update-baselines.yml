# update-baselines - makes the visual-regression baselines (e2e/__screenshots__/*.png) on the CI runner, because a baseline
# is valid only when made by the same browser and OS that compares it (Linux Chrome). Run by hand (workflow_dispatch) on a
# branch after adding screens to e2e/visual-screens.ts. The job only builds and uploads the PNGs as an artifact; it has
# read-only access and cannot push. Download the artifact, copy the PNGs into e2e/__screenshots__/, and commit them.
# While SCREENS in e2e/visual-screens.ts is empty, the run fails on purpose at `if-no-files-found: error` (no PNG is made),
# so a failure there with an empty list is not a bug.

name: update-baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Slow on some runners (26.10: the Azure Ubuntu mirror, 6.5 to 15 min): the job limit leaves room for it; never cut it short,
      # a killed apt keeps the dpkg lock and a retry fails (run 40365878428).
      - run: npx playwright install --with-deps chrome
      - run: npm run build-storybook
      - run: npx playwright test --project=chrome --update-snapshots --grep "visual:"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines
          path: e2e/__screenshots__/
          retention-days: 7
          if-no-files-found: error
      # The artifact host can be unreachable from an agent session; the log is not. Print each PNG's sha256 and its
      # base64 between markers, so ORCHESTRATOR can rebuild and check them from the job log (Afik, 17.10.2026).
      - name: Print the baselines into the log
        run: |
          cd e2e/__screenshots__
          for f in *.png; do
            echo "::group::${f}"
            echo "BASELINE-BEGIN ${f} $(sha256sum "${f}" | cut -d' ' -f1)"
            base64 -w 0 "${f}"; echo
            echo "BASELINE-END ${f}"
            echo "::endgroup::"
          done
