# demo-seed - the lecturer demo's content (docs/lecturer-demo-plan-HE.md v2, §2 stage ד and §3). One-off, by hand only, from main.
#
# The content is created THROUGH THE PRODUCT: tools/demo-seed signs in as each demo user (Supabase Auth, the publishable key) and calls
# the public API with that user's own permissions. The product has no demo-aware code. The time shift is the one step that writes to
# the database directly: it moves created_at back for the demo accounts' rows only (plan §3, Afik 15.10), in one transaction.
#
# step:
#   plan           the dry run: the content is checked and every step printed. No secret, no network.
#   seed           creates the content (accounts first; DEMO_ALLOW_SIGNUP creates missing ones). Safe to run again: skips what exists.
#   shift-dry-run  the time shift, rolled back: prints the row count per statement.
#   shift          the time shift, committed. Run once, right after the seed, off-peak: a table whose guard refuses the move is
#                  locked (ALTER TABLE) for the few seconds of the transaction. A statement that moves no row stops it (rollback).
#   walk           preview only, read only: every persona signs in and reads the screens it opens first (status, time, item count).
#   stories        the Stories only - on the demo day itself (a Story expires after 24 hours, FR-FEED-008).
#   load           read only: the personas sign in, then load_users users read their screens at once (tools/demo-seed/load.ts); the
#                  report (share within 2 s, percentiles, slowest paths) is the job summary. Production: at most 500 users, 60 s.
#   only           plan, seed, stories: comma-separated persona keys - run only the steps that touch them (a persona added after the
#                  first seed, e.g. "guest"). Content changed or removed in the product since the first seed is then never written again.
#
# Secrets and variables (Afik creates them; this file never prints one):
#   Preview  - environment `preview-e2e` (main only): DEMO_ACCOUNTS (secret), SUPABASE_PUBLISHABLE_KEY (variable, nestly-preview);
#              PREVIEW_DB_ADMIN_URL and VERCEL_AUTOMATION_BYPASS_SECRET are already there.
#   Production - environment `demo-production`, deployment branch main only, no required reviewer (Afik 26.10): DEMO_ACCOUNTS (secret),
#              no PRODUCTION_DB_ADMIN_URL (Afik 26.10: no shift on production; its content keeps the time of the run),
#              SUPABASE_PUBLISHABLE_KEY (variable, nestly-prod).
# Inputs reach the scripts through env only, never interpolated into `run:`.

name: demo-seed

on:
  workflow_dispatch:
    inputs:
      target:
        description: where the content goes
        type: choice
        default: preview
        options: [preview, production]
      step:
        description: plan (dry run) · seed · shift-dry-run · shift · walk (preview) · stories · load
        type: choice
        default: plan
        options: [plan, seed, shift-dry-run, shift, walk, stories, load]
      base_url:
        description: "preview only: the deployment URL (https://nestly-<hash>-afikyermis-projects.vercel.app)"
        type: string
        default: ""
      allow_signup:
        description: "seed: create the demo accounts that do not exist yet (tick it for the first seed only)"
        type: boolean
        default: false
      only:
        description: "plan, seed, stories: only the steps that touch these persona keys (comma-separated, e.g. guest); empty = all"
        type: string
        default: ""
      load_users:
        description: "load: concurrent users"
        type: string
        default: "500"
      load_duration_s:
        description: "load: seconds of full load, after a 20 s ramp (production: at most 60)"
        type: string
        default: "60"
      load_think_ms:
        description: "load: mean pause between one user's requests, in ms"
        type: string
        default: "1000"
      allow_empty:
        description: "shift: comma-separated statement labels whose 0 rows may not stop the apply (content the product refused)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: demo-seed-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  plan:
    name: demo-seed plan
    if: inputs.step == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w @nestly/shared
      - name: Dry run
        env:
          DEMO_ONLY: ${{ inputs.only }}
        run: |
          node tools/demo-seed/cli.ts plan seed
          node tools/demo-seed/cli.ts plan stories

  preview:
    name: demo-seed preview
    if: inputs.target == 'preview' && inputs.step != 'plan' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: preview-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Dependencies and the shared build run before any step holds a secret.
      - run: npm ci --ignore-scripts
      - run: npm run build -w @nestly/shared
      - name: Seed or Stories
        if: inputs.step == 'seed' || inputs.step == 'stories'
        env:
          STEP: ${{ inputs.step }}
          DEMO_BASE_URL: ${{ inputs.base_url }}
          DEMO_ALLOW_SIGNUP: ${{ inputs.allow_signup && '1' || '0' }}
          DEMO_ONLY: ${{ inputs.only }}
          DEMO_ACCOUNTS: ${{ secrets.DEMO_ACCOUNTS }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node tools/demo-seed/cli.ts run "$STEP" preview
      - name: Role walk
        if: inputs.step == 'walk'
        env:
          DEMO_BASE_URL: ${{ inputs.base_url }}
          DEMO_ACCOUNTS: ${{ secrets.DEMO_ACCOUNTS }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node tools/demo-seed/cli.ts walk preview
      - name: Load test
        if: inputs.step == 'load'
        env:
          DEMO_BASE_URL: ${{ inputs.base_url }}
          DEMO_ACCOUNTS: ${{ secrets.DEMO_ACCOUNTS }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          LOAD_USERS: ${{ inputs.load_users }}
          LOAD_DURATION_S: ${{ inputs.load_duration_s }}
          LOAD_THINK_MS: ${{ inputs.load_think_ms }}
        run: node tools/demo-seed/cli.ts load preview
      - name: Time shift
        if: inputs.step == 'shift-dry-run' || inputs.step == 'shift'
        env:
          SHIFT_MODE: ${{ inputs.step == 'shift' && 'apply' || 'dry-run' }}
          DEMO_SHIFT_ALLOW_EMPTY: ${{ inputs.allow_empty }}
          DEMO_DB_ADMIN_URL: ${{ secrets.PREVIEW_DB_ADMIN_URL }}
          DEMO_ACCOUNTS: ${{ secrets.DEMO_ACCOUNTS }}
        run: node tools/demo-seed/shift-cli.ts preview "$SHIFT_MODE"

  production:
    name: demo-seed production
    if: inputs.target == 'production' && inputs.step != 'plan' && inputs.step != 'walk' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # main only. Afik 26.10: the seed runs here without a reviewer; the shift has no database secret here and fails.
    environment: demo-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w @nestly/shared
      - name: Seed or Stories
        if: inputs.step == 'seed' || inputs.step == 'stories'
        env:
          STEP: ${{ inputs.step }}
          DEMO_ALLOW_SIGNUP: ${{ inputs.allow_signup && '1' || '0' }}
          DEMO_ONLY: ${{ inputs.only }}
          DEMO_ACCOUNTS: ${{ secrets.DEMO_ACCOUNTS }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node tools/demo-seed/cli.ts run "$STEP" production
      - name: Load test
        if: inputs.step == 'load'
        env:
          DEMO_BASE_URL: ${{ inputs.base_url }}
          DEMO_ACCOUNTS: ${{ secrets.DEMO_ACCOUNTS }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          LOAD_USERS: ${{ inputs.load_users }}
          LOAD_DURATION_S: ${{ inputs.load_duration_s }}
          LOAD_THINK_MS: ${{ inputs.load_think_ms }}
        run: node tools/demo-seed/cli.ts load production
      - name: Time shift
        if: inputs.step == 'shift-dry-run' || inputs.step == 'shift'
        env:
          SHIFT_MODE: ${{ inputs.step == 'shift' && 'apply' || 'dry-run' }}
          DEMO_SHIFT_ALLOW_EMPTY: ${{ inputs.allow_empty }}
          DEMO_DB_ADMIN_URL: ${{ secrets.PRODUCTION_DB_ADMIN_URL }}
          DEMO_ACCOUNTS: ${{ secrets.DEMO_ACCOUNTS }}
        run: node tools/demo-seed/shift-cli.ts production "$SHIFT_MODE"
