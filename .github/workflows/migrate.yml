# migrate - applies supabase/migrations to nestly-preview, then to nestly-prod after Afik's approval
# (I1 F1.1 spec criterion 5; decisions 2026-10-11 "Migration path", 2026-10-11 GitHub environments,
# 2026-10-12 the migration secret, 2026-10-13 F1.1 Q3).
#
# Triggers: a push to main that changes supabase/migrations/**, or a manual run (Actions -> migrate -> Run workflow).
# Never pull_request or pull_request_target: a pull request never reaches a migration secret.
#
#   preview     environment db-preview. Runs first, from any ref a manual run names (a feature's migrations run on
#               nestly-preview before merge), or from main.
#   production  environment db-production: deployment branch main only (Afik removed the reviewer until launch,
#               16.10.2026). Runs only from main, only after preview succeeded, and only in a manual run, so a merge never
#               queues an approval. Schema before code (P6): ORCHESTRATOR dispatches it after a schema PR merges; CI
#               `schema-gate` keeps product code from merging until this job has applied every migration in its tree.
#
# Each job reads one secret, APP_OWNER_DATABASE_URL of its environment. tools/migrate-url-guard.mjs refuses it unless
# its user is app_owner.<that environment's project ref> and its port is 5432 (session pooler). Nothing prints the
# URL: no set -x, no echo, and the guard's messages name only what was expected.
#
# Hardening (14.10 review findings 1-3, low 7): every action is pinned to a commit SHA; the CLI comes from a committed
# lockfile with sha512 hashes (tools/supabase-cli); the guard also requires TLS (PGSSLMODE=require) and masks the
# password in all its forms; the push output passes tools/filter-db-push-log.mjs, an allowlist.
#
# Before the push, each job checks the auth functions against the pins the CI `db` job checks (read only). Its psql
# step requires TLS (PGSSLMODE=require) and first connects with all output discarded, since a libpq error can quote
# the URL (part a CRITIC finding 1).
#
# The command is the one the CI `db` job runs against its disposable database, with the same pinned CLI. With
# nothing pending it applies nothing (criterion 6, shown in that job).

name: migrate

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

# One migration run at a time, and never cancelled halfway.
concurrency:
  group: migrate
  cancel-in-progress: false

env:
  # Same pin as the CI `db` job (.github/workflows/ci.yml).
  SUPABASE_CLI_VERSION: 2.120.0

jobs:
  preview:
    name: db-preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: db-preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # Installed before any step holds the secret.
      - name: Install psql and the Supabase CLI (integrity-pinned)
        run: |
          set -eu
          # psql: Ubuntu's signed archive (apt checks the signatures). An exact apt version is not pinned on purpose: the
          # archive drops superseded versions, which would break this job on the day it matters. The version is only printed.
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-client
          psql --version
          # CLI: tools/supabase-cli/package-lock.json (sha512 per tarball) with npm ci --ignore-scripts.
          bash tools/install-supabase-cli.sh
      - name: Check the connection URL
        env:
          APP_OWNER_DATABASE_URL: ${{ secrets.APP_OWNER_DATABASE_URL }}
          PGSSLMODE: require
        # --mask registers the password (raw, decoded, re-encoded) and the URL as masks for the rest of the job.
        run: node tools/migrate-url-guard.mjs db-preview --mask
      # Read only: the auth functions on the target are the ones every CI pgTAP result ran on (schema.md
      # "Addendum 1 — CI auth functions"). A mismatch stops the job before anything is applied.
      - name: Check the auth functions match the pinned hashes
        env:
          APP_OWNER_DATABASE_URL: ${{ secrets.APP_OWNER_DATABASE_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "15"
        run: |
          set -eu
          # Connect once with every line of psql output discarded: libpq errors can quote the URL (db-check.yml does
          # the same). After that the URL has parsed and logged in, so what the check prints comes from the server.
          probe() { psql "${APP_OWNER_DATABASE_URL}" -X -q -A -t -c 'select 1'; }
          if ! probe >/dev/null 2>&1; then
            echo "::error::could not connect as app_owner (psql output discarded: it can quote the URL)"
            exit 1
          fi
          psql "${APP_OWNER_DATABASE_URL}" -X -q -v ON_ERROR_STOP=1 -f supabase/ci/auth-functions-check.sql
      - name: Apply pending migrations to nestly-preview
        env:
          APP_OWNER_DATABASE_URL: ${{ secrets.APP_OWNER_DATABASE_URL }}
          # pgx (the CLI's driver) reads the libpq variable: TLS is required even if the URL names no sslmode.
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "15"
        # The CLI's output goes through an allowlist filter, never to the log as it is: a connection error can quote the
        # URL. pipefail keeps the CLI's exit status.
        run: |
          set -euo pipefail
          if ! supabase db push --db-url "${APP_OWNER_DATABASE_URL}" --yes --skip-vault --agent no 2>&1 | node tools/filter-db-push-log.mjs; then
            echo "::error::supabase db push failed (its output is filtered: only migration names and ERROR/SQLSTATE lines are shown)"
            exit 1
          fi

  production:
    name: db-production
    needs: preview
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: db-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # Installed before any step holds the secret.
      - name: Install psql and the Supabase CLI (integrity-pinned)
        run: |
          set -eu
          # psql: Ubuntu's signed archive (apt checks the signatures). An exact apt version is not pinned on purpose: the
          # archive drops superseded versions, which would break this job on the day it matters. The version is only printed.
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-client
          psql --version
          # CLI: tools/supabase-cli/package-lock.json (sha512 per tarball) with npm ci --ignore-scripts.
          bash tools/install-supabase-cli.sh
      - name: Check the connection URL
        env:
          APP_OWNER_DATABASE_URL: ${{ secrets.APP_OWNER_DATABASE_URL }}
          PGSSLMODE: require
        # --mask registers the password (raw, decoded, re-encoded) and the URL as masks for the rest of the job.
        run: node tools/migrate-url-guard.mjs db-production --mask
      # Read only: the auth functions on the target are the ones every CI pgTAP result ran on (schema.md
      # "Addendum 1 — CI auth functions"). A mismatch stops the job before anything is applied.
      - name: Check the auth functions match the pinned hashes
        env:
          APP_OWNER_DATABASE_URL: ${{ secrets.APP_OWNER_DATABASE_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "15"
        run: |
          set -eu
          # Connect once with every line of psql output discarded: libpq errors can quote the URL (db-check.yml does
          # the same). After that the URL has parsed and logged in, so what the check prints comes from the server.
          probe() { psql "${APP_OWNER_DATABASE_URL}" -X -q -A -t -c 'select 1'; }
          if ! probe >/dev/null 2>&1; then
            echo "::error::could not connect as app_owner (psql output discarded: it can quote the URL)"
            exit 1
          fi
          psql "${APP_OWNER_DATABASE_URL}" -X -q -v ON_ERROR_STOP=1 -f supabase/ci/auth-functions-check.sql
      - name: Apply pending migrations to nestly-prod
        env:
          APP_OWNER_DATABASE_URL: ${{ secrets.APP_OWNER_DATABASE_URL }}
          # pgx (the CLI's driver) reads the libpq variable: TLS is required even if the URL names no sslmode.
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "15"
        # The CLI's output goes through an allowlist filter, never to the log as it is: a connection error can quote the
        # URL. pipefail keeps the CLI's exit status.
        run: |
          set -euo pipefail
          if ! supabase db push --db-url "${APP_OWNER_DATABASE_URL}" --yes --skip-vault --agent no 2>&1 | node tools/filter-db-push-log.mjs; then
            echo "::error::supabase db push failed (its output is filtered: only migration names and ERROR/SQLSTATE lines are shown)"
            exit 1
          fi
