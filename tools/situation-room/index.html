<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חדר מצב · Nestly</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --line: #d9d5cc; --text: #1f1d1a; --muted: #5f5a52;
    --live: #14753d; --warn: #8a5a00; --bad: #b02a1c; --accent: #2f4ac0;
    --pulse: rgba(20,117,61,.18); --chip: #efece6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141517; --panel: #1c1e21; --line: #3a3d43; --text: #ecebe8; --muted: #a8a59d;
      --live: #3ccf7f; --warn: #e2a94a; --bad: #ef6b5b; --accent: #8da3ff;
      --pulse: rgba(60,207,127,.16); --chip: #25282c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, "Segoe UI", Rubik, Arial, sans-serif; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 2; }
  h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); flex: none; }
  .dot.on { background: var(--live); box-shadow: 0 0 0 0 var(--pulse); animation: ping 1.6s infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 var(--pulse) } 100% { box-shadow: 0 0 0 10px transparent } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  nav { display: flex; gap: 4px; }
  nav button { font: inherit; background: var(--chip); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 4px 14px; cursor: pointer; }
  nav button[aria-current="page"] { background: var(--accent); color: var(--panel); border-color: var(--accent); font-weight: 700; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-inline-start: auto; }
  .stat { background: var(--chip); border-radius: 8px; padding: 4px 10px; font-size: 13px; color: var(--muted); }
  .stat b { color: var(--text); font-size: 15px; margin-inline-end: 4px; }
  main { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; padding: 16px 20px 40px; }
  main[hidden] { display: none; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px 16px 32px; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  h2 { font-size: 13px; letter-spacing: .02em; color: var(--muted); margin: 0 0 10px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: baseline; }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; position: relative;
    border-inline-start: 4px solid var(--role, var(--muted)); min-width: 0; }
  .card.run { box-shadow: 0 0 0 3px var(--pulse); }
  .card.quiet { opacity: .8; }
  .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .role { font-weight: 700; font-size: 12px; letter-spacing: .04em; }
  .time { margin-inline-start: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
  .desc { margin: 4px 0 6px; font-size: 14px; overflow-wrap: anywhere; }
  .now { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .now bdi { color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 11px; color: var(--muted); }
  .chip.skill { color: var(--accent); }
  .chip.step { color: var(--text); font-weight: 600; }
  .chip.bad { color: var(--bad); font-weight: 600; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .badge.work { color: var(--text); font-weight: 700; }
  .spin { width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: blink 1s infinite; flex: none; }
  @keyframes blink { 50% { opacity: .25 } }
  .done-row { display: flex; gap: 8px; align-items: center; min-width: 0; padding: 6px 0; border-top: 1px solid var(--line);
    border-inline-start: 4px solid var(--role, var(--muted)); padding-inline-start: 8px; }
  .done-row:first-of-type { border-top: 0; }
  .done-row .d { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .who { font-weight: 600; }
  .bars { display: grid; gap: 6px; }
  .bar { display: grid; grid-template-columns: minmax(90px, 140px) 1fr 28px; gap: 8px; align-items: center; font-size: 13px; }
  .bar .track { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .bar .n { color: var(--muted); font-variant-numeric: tabular-nums; text-align: end; }
  .flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: var(--pulse) } to { background: transparent } }
  ol.feed { list-style: none; margin: 0; padding: 0; max-height: 520px; overflow: auto; }
  ol.feed li { display: grid; grid-template-columns: 54px 1fr; gap: 8px; padding: 4px 0; border-top: 1px solid var(--line); font-size: 12.5px; min-width: 0; }
  ol.feed li:first-child { border-top: 0; }
  ol.feed .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  ol.feed .w { overflow-wrap: anywhere; }
  ol.feed .block { font-weight: 600; color: var(--bad); }
  .muted { color: var(--muted); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: start; padding: 5px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  thead th { color: var(--muted); font-weight: 600; border-top: 0; }
  td.n, th.n { text-align: end; font-variant-numeric: tabular-nums; }
  details > summary { cursor: pointer; color: var(--accent); }
  details table { margin-top: 4px; }
  h3 { font-size: 13px; margin: 14px 0 6px; }
  .hist { display: block; max-width: 1100px; margin: 0 auto; }
  .notice { background: var(--chip); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; font-size: 13px; }
  .tools { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  select { font: inherit; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
  .day { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; align-items: center; padding: 3px 0; font-size: 13px; }
  .day .track { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .day .fill { height: 10px; background: var(--bad); border-radius: 3px; flex: none; }
  .day.nodata { color: var(--muted); }
  svg.tl { width: 100%; height: auto; display: block; }
  svg.tl text { fill: var(--text); font-size: 11px; }
  svg.tl .axis { stroke: var(--line); }
  svg.tl .nodata { fill: var(--chip); stroke: var(--line); stroke-dasharray: 4 3; }
  svg.tl .run { fill: var(--accent); }
  svg.tl .part { fill: var(--muted); }
  svg.tl .pt { fill: var(--panel); stroke: var(--text); stroke-width: 1.5; }
  svg.tl .mg { fill: var(--text); stroke: var(--text); }
  svg.tl .bk { fill: var(--bad); }
  button.link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; font-size: 12px; padding: 0; }
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="dot" aria-hidden="true"></span>חדר מצב · Nestly</h1>
  <nav aria-label="תצוגות">
    <button type="button" id="tab-live" aria-current="page">חי</button>
    <button type="button" id="tab-history">היסטוריה</button>
  </nav>
  <span class="muted" id="conn" role="status">מתחבר…</span>
  <div class="stats" id="stats"></div>
</header>
<main id="view-live">
  <div>
    <section aria-labelledby="h-agents">
      <h2 id="h-agents"><span>סוכנים בפעולה</span><span id="agents-n"></span></h2>
      <div class="cards" id="agents"></div>
    </section>
    <section aria-labelledby="h-sessions">
      <h2 id="h-sessions"><span>סשנים · ORCHESTRATOR</span><button class="link" id="toggle-old" type="button"></button></h2>
      <div class="cards" id="sessions"></div>
    </section>
    <section aria-labelledby="h-done">
      <h2 id="h-done"><span>סוכנים שסיימו</span></h2>
      <div id="done"></div>
    </section>
  </div>
  <div>
    <section aria-labelledby="h-skills">
      <h2 id="h-skills"><span>סקילים · היום</span></h2>
      <div class="bars" id="skills"></div>
    </section>
    <section aria-labelledby="h-feed">
      <h2 id="h-feed"><span>יומן חי</span></h2>
      <ol class="feed" id="feed" aria-live="off"></ol>
    </section>
  </div>
</main>
<main id="view-history" class="hist" hidden>
  <div id="hist-notice" class="notice" role="status"></div>
  <div class="tools"><label for="hist-range">טווח לחסימות ולציר הזמן</label>
    <select id="hist-range"><option value="7">7 ימים</option><option value="14">14 ימים</option><option value="30" selected>30 ימים</option><option value="60">60 ימים</option></select></div>
  <section aria-labelledby="h-usage"><h2 id="h-usage"><span>שימוש לפי סוכן וסקיל</span></h2><div id="hist-usage"></div></section>
  <section aria-labelledby="h-rounds"><h2 id="h-rounds"><span>סבבי CRITIC ו-TEST ENGINEER לפי חלק</span></h2><div id="hist-rounds"></div></section>
  <section aria-labelledby="h-blocks"><h2 id="h-blocks"><span>חסימות לאורך זמן</span></h2><div id="hist-blocks"></div></section>
  <section aria-labelledby="h-timeline"><h2 id="h-timeline"><span>ציר זמן</span></h2><div id="hist-timeline"></div></section>
</main>
<script>
"use strict";
// Event shapes come from .claude/hooks/situation-log.js, after the server's allowlist and with
// `feature`, `part` and `step` added by tools/situation-room/derive.mjs.
const QUIET_MS = 15 * 60 * 1000;   // an agent or session with no event for this long is quiet
const NO_PART = "ללא חלק";
const ROLES = {
  orchestrator: ["ORCHESTRATOR", "#3b5bdb"], spec: ["SPEC", "#7048e8"], builder: ["BUILDER", "#e8590c"],
  critic: ["CRITIC", "#c2255c"], "test-engineer": ["TEST ENGINEER", "#2b8a3e"],
  "data-architect": ["DATA ARCHITECT", "#1098ad"], "algorithm-data": ["ALGORITHM & DATA", "#a61e4d"],
  scout: ["SCOUT", "#868e96"],
};
const VERBS = {
  Read: "קורא", Write: "כותב", Edit: "עורך", MultiEdit: "עורך", NotebookEdit: "עורך", Bash: "מריץ",
  PowerShell: "מריץ", Grep: "מחפש", Glob: "מחפש קבצים", Skill: "סקיל", Agent: "מפעיל סוכן", Task: "מפעיל סוכן",
  WebSearch: "מחפש ברשת", WebFetch: "קורא דף", TodoWrite: "מעדכן משימות",
};

const S = { sessions: new Map(), agents: new Map(), calls: new Map(), pending: [], skills: [], feed: [], tools: 0, showOld: false };

function role(type) {
  const k = String(type || "").toLowerCase();
  if (!k || k === "orchestrator") return ROLES.orchestrator;
  return ROLES[k] || [String(type).toUpperCase(), "#868e96"];
}
function who(ev) { return ev.aid ? S.agents.get(ev.aid) : null; }
function session(ev) {
  let s = S.sessions.get(ev.sid);
  if (!s) { s = { sid: ev.sid, startedAt: ev.t, lastAt: ev.t, status: "idle", tools: 0, skills: new Map() }; S.sessions.set(ev.sid, s); }
  s.lastAt = ev.t;
  return s;
}
function today(t) { const d = new Date(); d.setHours(0, 0, 0, 0); return t >= d.getTime(); }
function partLabel(feature, part) { return !part || part === NO_PART ? NO_PART : `${feature} · ${part}`; }
function stepLabel(step) {
  if (step === null || step === undefined) return "";
  return step === "support" ? "תמיכה" : `שלב ${step}`;
}
function feed(ev, text, kind) {
  S.feed.push({ t: ev.t, text, kind, type: ev.aid ? who(ev)?.type : null });
  if (S.feed.length > 300) S.feed.shift();
}

function apply(ev) {
  if (!ev || !ev.sid) return;
  const s = session(ev);
  const a = who(ev);
  if (a) a.lastAt = ev.t;
  if (!ev.aid && ev.branch) { s.branch = ev.branch; s.feature = ev.feature; s.part = ev.part; }
  switch (ev.ev) {
    case "SessionStart":
      s.status = "idle"; s.ended = false;
      feed(ev, `סשן ${ev.source === "resume" ? "חודש" : "נפתח"}${ev.branch ? ` על ${ev.branch}` : ""}`, "sys");
      break;
    case "SessionEnd":
      s.status = "ended"; s.ended = true; s.current = null;
      feed(ev, "סשן נסגר", "sys"); break;
    case "UserPromptSubmit":
      s.status = "working"; s.promptAt = ev.t; break;
    case "UserPromptExpansion":
      if (ev.skill) addSkill(ev, ev.skill, "slash");
      break;
    case "Stop":
      if (!ev.aid) { s.status = "idle"; s.current = null; }
      break;
    case "Block":
      feed(ev, `חסימה (${ev.role || "?"}${ev.tool ? ` · ${ev.tool}` : ""}): ${ev.reason || ""}`, "block");
      break;
    case "PreToolUse": {
      S.tools += today(ev.t) ? 1 : 0;
      S.calls.set(ev.id, { tool: ev.tool, target: ev.target, t: ev.t, aid: ev.aid });
      const cur = { tool: ev.tool, target: ev.target, t: ev.t };
      if (a) { a.current = cur; a.tools++; } else if (!ev.aid) { s.current = cur; s.tools++; if (s.status !== "ended") s.status = "working"; }
      if (ev.tool === "Skill" && ev.skill) addSkill(ev, ev.skill, "tool");
      if (ev.tool === "Agent" || ev.tool === "Task") {
        S.pending.push({ sid: ev.sid, type: ev.subagent, desc: ev.target, t: ev.t, id: ev.id });
        feed(ev, `הפעיל ${role(ev.subagent)[0]}: ${ev.target || ""}`, "agent");
      }
      break;
    }
    case "PostToolUse":
    case "PostToolUseFailure": {
      const c = S.calls.get(ev.id); S.calls.delete(ev.id);
      const holder = a || (!ev.aid ? s : null);
      if (holder && holder.current && c && holder.current.t === c.t) holder.current = null;
      if (ev.failed && !ev.interrupt) {
        if (a) a.fails = (a.fails || 0) + 1;
        feed(ev, `${ev.tool} נכשל${c && c.target ? `: ${c.target}` : ""}`, "bad");
      }
      break;
    }
    case "SubagentStart": {
      const i = S.pending.findIndex(p => p.sid === ev.sid && p.type === ev.who);
      const p = i >= 0 ? S.pending.splice(i, 1)[0] : null;
      S.agents.set(ev.aid, {
        aid: ev.aid, sid: ev.sid, type: ev.who, desc: p ? p.desc : "", startedAt: ev.t, lastAt: ev.t, tools: 0,
        skills: new Set(), running: true, branch: ev.branch, feature: ev.feature, part: ev.part, step: ev.step,
      });
      break;
    }
    case "SubagentStop":
      if (a) {
        a.running = false; a.endedAt = ev.t; a.current = null;
        feed(ev, `${role(a.type)[0]} סיים${a.desc ? `: ${a.desc}` : ""}`, "agent");
      }
      break;
  }
}
function addSkill(ev, name, via) {
  const a = who(ev);
  S.skills.push({ t: ev.t, name, by: a ? a.type : null, via });
  if (a) a.skills.add(name);
  else S.sessions.get(ev.sid)?.skills.set(name, ev.t);
  feed(ev, `סקיל ${name}${via === "slash" ? " (פקודה)" : ""}`, "skill");
  lastSkill = name;
}
let lastSkill = null;

// ---------- render ----------
const $ = id => document.getElementById(id);
function esc(x) { return String(x ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function dur(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return `${s} שנ׳`;
  const m = Math.floor(s / 60); if (m < 60) return `${m}:${String(s % 60).padStart(2, "0")} דק׳`;
  return `${Math.floor(m / 60)} ש׳ ${m % 60} דק׳`;
}
function clock(t) { return new Date(t).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit", second: "2-digit" }); }
function nowLine(cur) {
  if (!cur) return "";
  const v = VERBS[cur.tool] || (cur.tool && cur.tool.startsWith("mcp__") ? cur.tool.split("__").slice(1).join(" · ") : cur.tool);
  return `<div class="now">${esc(v)}${cur.target ? ` · <bdi>${esc(cur.target)}</bdi>` : ""} <span class="muted">(${dur(Date.now() - cur.t)})</span></div>`;
}
function whereChips(x, stepText) {
  return `<span class="chip">${esc(partLabel(x.feature, x.part))}</span>${stepText ? `<span class="chip step">${esc(stepText)}</span>` : ""}`;
}

function renderLive() {
  const now = Date.now();
  const agents = [...S.agents.values()];
  const running = agents.filter(a => a.running && now - a.lastAt < 6 * 3600e3)
    .sort((x, y) => x.startedAt - y.startedAt);
  $("agents").innerHTML = running.length ? running.map(a => {
    const [name, color] = role(a.type); const quiet = now - a.lastAt > QUIET_MS;
    return `<article class="card ${quiet ? "quiet" : "run"}" style="--role:${color}">
      <div class="row">${quiet ? "" : '<span class="spin" aria-hidden="true"></span>'}<span class="role">${esc(name)}</span>
        ${quiet ? '<span class="badge">שקט</span>' : ""}<span class="time">${dur(now - a.startedAt)}</span></div>
      <div class="desc">${esc(a.desc || "—")}</div>
      ${nowLine(a.current)}
      <div class="chips"><span class="chip">ענף <bdi>${esc(a.branch || "—")}</bdi></span>${whereChips(a, stepLabel(a.step))}</div>
      <div class="chips"><span class="chip">${a.tools} פעולות</span>${a.fails ? `<span class="chip bad">${a.fails} כשלים</span>` : ""}
        ${[...a.skills].map(k => `<span class="chip skill">סקיל ${esc(k)}</span>`).join("")}</div>
    </article>`;
  }).join("") : '<div class="empty">אין סוכן שרץ עכשיו.</div>';
  $("agents-n").textContent = running.length ? `${running.length} פעילים` : "";

  const sessions = [...S.sessions.values()].sort((x, y) => y.lastAt - x.lastAt);
  const live = sessions.filter(s => !s.ended && now - s.lastAt < 2 * 3600e3);
  const shown = S.showOld ? sessions.slice(0, 30) : live;
  $("toggle-old").textContent = S.showOld ? "רק פעילים" : `כל הסשנים (${sessions.length})`;
  $("sessions").innerHTML = shown.length ? shown.map(s => {
    const working = s.status === "working" && now - s.lastAt < QUIET_MS;
    const sub = agents.filter(a => a.sid === s.sid && a.running).length;
    const badge = s.ended ? '<span class="badge">נסגר</span>' : working ? '<span class="badge work">עובד</span>' : '<span class="badge">ממתין</span>';
    return `<article class="card ${working ? "run" : ""}" style="--role:${ROLES.orchestrator[1]}">
      <div class="row">${working ? '<span class="spin" aria-hidden="true"></span>' : ""}<span class="role"><bdi>${esc(s.branch || "—")}</bdi></span>${badge}
        <span class="time">${s.promptAt ? dur(now - s.promptAt) : ""}</span></div>
      <div class="chips">${whereChips(s, "תזמור")}</div>
      ${working ? nowLine(s.current) : ""}
      <div class="chips"><span class="chip">${s.tools} פעולות</span>${sub ? `<span class="chip">${sub} סוכנים</span>` : ""}
        ${[...s.skills.keys()].slice(-5).map(k => `<span class="chip skill">סקיל ${esc(k)}</span>`).join("")}</div>
    </article>`;
  }).join("") : '<div class="empty">אין סשן פעיל. ברגע שמישהו עובד על הפרויקט הוא יופיע כאן.</div>';

  const done = agents.filter(a => !a.running && a.endedAt).sort((x, y) => y.endedAt - x.endedAt).slice(0, 25);
  $("done").innerHTML = done.length ? done.map(a => {
    const [name, color] = role(a.type);
    return `<div class="done-row" style="--role:${color}">
      <span class="who">${esc(name)}</span><span class="d">${esc(a.desc || "")}</span>
      <span class="chip">${esc(partLabel(a.feature, a.part))}</span><span class="chip step">${esc(stepLabel(a.step))}</span>
      <span class="time">${clock(a.endedAt)} · ${dur(a.endedAt - a.startedAt)} · ${a.tools} פעולות</span></div>`;
  }).join("") : '<div class="empty">עוד אין.</div>';

  const counts = new Map();
  for (const k of S.skills) if (today(k.t)) counts.set(k.name, (counts.get(k.name) || 0) + 1);
  const top = [...counts.entries()].sort((x, y) => y[1] - x[1]);
  const max = top.length ? top[0][1] : 1;
  $("skills").innerHTML = top.length ? top.map(([k, n]) =>
    `<div class="bar ${k === lastSkill ? "flash" : ""}"><bdi>${esc(k)}</bdi><div class="track"><div class="fill" style="width:${(n / max) * 100}%"></div></div><span class="n">${n}</span></div>`
  ).join("") : '<div class="empty">עוד לא הופעל סקיל היום.</div>';
  lastSkill = null;

  const recent = S.feed.slice(-120).reverse();
  $("feed").innerHTML = recent.length ? recent.map(f => {
    const [name] = role(f.type);
    return `<li><span class="t">${clock(f.t).slice(0, 5)}</span><span class="w"><span class="who">${esc(name)}</span> <span class="${f.kind === "block" ? "block" : ""}">${esc(f.text)}</span></span></li>`;
  }).join("") : '<li><span></span><span class="muted">היומן ריק.</span></li>';

  const todaySkills = S.skills.filter(k => today(k.t)).length;
  const todayAgents = agents.filter(a => today(a.startedAt)).length;
  $("stats").innerHTML = [
    [live.length, "סשנים פעילים"], [running.length, "סוכנים רצים"],
    [todayAgents, "סוכנים היום"], [todaySkills, "סקילים היום"], [S.tools, "פעולות היום"],
  ].map(([n, l]) => `<span class="stat"><b>${n}</b>${l}</span>`).join("");
}

// ---------- history ----------
const H = { summary: null, timer: null };
const NODATA = "אין נתונים";
const dm = d => d.slice(8, 10) + "." + d.slice(5, 7);
function table(head, rows) {
  return `<table><thead><tr>${head.map(([t, n]) => `<th scope="col"${n ? ' class="n"' : ""}>${t}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`;
}
function usageTable(rows, kind) {
  if (!rows.length) return `<div class="empty">${NODATA}.</div>`;
  const cols = kind === "agent"
    ? [["הרצות", p => p.runs + (p.running ? ` (${p.running} פתוחות)` : "")], ["זמן כולל", p => dur(p.ms)]]
    : [["שימושים", p => p.uses], ["זמן טעינה", p => (p.ms ? dur(p.ms) : "—")]];
  const inner = parts => table([["חלק"], ...cols.map(c => [c[0], true])], parts.map(p =>
    `<tr><td><bdi>${esc(partLabel(p.feature, p.part))}</bdi></td>${cols.map(c => `<td class="n">${c[1](p)}</td>`).join("")}</tr>`));
  return table([[kind === "agent" ? "סוכן" : "סקיל"], ...cols.map(c => [c[0], true]), ["לפי חלק"]], rows.map(r =>
    `<tr><th scope="row"><bdi>${esc(kind === "agent" ? role(r.who)[0] : r.name)}</bdi></th>${cols.map(c => `<td class="n">${c[1](r)}</td>`).join("")}
      <td><details><summary>חלקים (${r.parts.length})</summary>${inner(r.parts)}</details></td></tr>`));
}
function renderBlocks(s) {
  const days = s.blocks.days;
  const max = Math.max(1, ...days.map(d => d.total));
  const totals = new Map();
  for (const d of days) for (const r of d.roles) totals.set(r.key, (totals.get(r.key) || 0) + r.n);
  const sum = [...totals.entries()].sort((a, b) => b[1] - a[1]);
  const total = days.reduce((a, d) => a + d.total, 0);
  return `<div class="chips" style="margin:0 0 8px"><span class="chip step">סה״כ ${total}</span>${sum.map(([k, n]) => `<span class="chip">${esc(k)} ${n}</span>`).join("")}</div>` +
    days.slice().reverse().map(d => d.noData
      ? `<div class="day nodata"><span>${dm(d.date)}</span><span class="track">${NODATA}</span></div>`
      : `<div class="day"><span>${dm(d.date)}</span><span class="track"><span class="fill" style="width:${(d.total / max) * 60}%"></span><b>${d.total}</b>
          <span class="muted">${d.roles.slice(0, 4).map(r => `${esc(r.key)} ${r.n}`).join(" · ")}</span></span></div>`).join("");
}
function renderTimeline(s) {
  const { fromT, toT } = s.range, W = 960, L = 110, R = 10, span = Math.max(1, toT - fromT), tl = s.timeline;
  const X = t => R + (1 - (Math.min(Math.max(t, fromT), toT) - fromT) / span) * (W - L - R); // time runs right to left
  const whos = [...new Set(tl.runs.map(r => r.who))].sort();
  const rows = ["קומיטים", "חסימות", ...whos.map(w => role(w)[0]), "חלקים"];
  const rowY = i => 16 + i * 22, height = 16 + rows.length * 22 + 22;
  let g = rows.map((r, i) => `<text x="${W - 4}" y="${rowY(i) + 4}" text-anchor="end">${esc(r)}</text><line class="axis" x1="${R}" x2="${W - L + R}" y1="${rowY(i) + 8}" y2="${rowY(i) + 8}"/>`).join("");
  if (s.firstEvent && s.firstEvent.t > fromT) {
    const x1 = X(s.firstEvent.t);
    g += `<rect class="nodata" x="${x1}" y="4" width="${W - L + R - x1}" height="${rows.length * 22 + 8}"><title>${NODATA} על סוכנים לפני ${dm(s.firstEvent.date)}</title></rect><text x="${W - L - 4}" y="${height - 6}" text-anchor="end">${NODATA} על סוכנים</text>`;
  }
  for (const c of tl.commits) {
    const cx = X(c.t), y = rowY(0) + 4;
    g += c.merge
      ? `<path class="mg" d="M${cx} ${y - 6}l6 6l-6 6l-6 -6z"><title>מיזוג · ${esc(c.subject)}</title></path>`
      : `<circle class="pt" cx="${cx}" cy="${y}" r="3.5"><title>${esc(c.subject)}</title></circle>`;
  }
  for (const b of tl.blocks) g += `<rect class="bk" x="${X(b.t) - 2}" y="${rowY(1) - 2}" width="4" height="12"><title>חסימה · ${esc(b.role)}${b.tool ? " · " + esc(b.tool) : ""}</title></rect>`;
  for (const r of tl.runs) {
    const a = X(r.end ?? toT), b = X(r.start);
    g += `<rect class="run" x="${a}" y="${rowY(2 + whos.indexOf(r.who))}" width="${Math.max(2, b - a)}" height="10" rx="2"><title>${esc(role(r.who)[0])} · ${esc(r.part)}${r.end ? "" : " · רץ"}</title></rect>`;
  }
  tl.parts.forEach((p, k) => {
    const a = X(p.to), b = X(p.from);
    g += `<rect class="part" x="${a}" y="${rowY(rows.length - 1) + (k % 2) * 6}" width="${Math.max(2, b - a)}" height="5" rx="2"><title>${esc(partLabel(p.feature, p.part))}</title></rect>`;
  });
  const list = tl.commits.slice(0, 40).map(c => `<tr><td>${new Date(c.t).toLocaleDateString("he-IL")}</td><td>${c.merge ? '<span class="badge work">מיזוג</span>' : ""}</td><td><bdi>${esc(c.subject)}</bdi></td></tr>`);
  return `<svg class="tl" viewBox="0 0 ${W} ${height}" role="img" aria-label="ציר זמן של קומיטים, חסימות, ריצות סוכנים וחלקים. ישן מימין, חדש משמאל. הרשימה שמתחת מפרטת את הקומיטים."><title>ציר זמן</title>${g}</svg>
    <p class="muted">יהלום = מיזוג · עיגול = קומיט · פס אדום = חסימה · פס כחול = ריצת סוכן. ישן מימין, חדש משמאל.</p>
    ${list.length ? table([["תאריך"], [""], ["נושא"]], list) : `<div class="empty">אין קומיטים בטווח (או שאין git).</div>`}`;
}
function renderHistory() {
  const s = H.summary;
  if (!s) { $("hist-notice").textContent = "טוען…"; return; }
  $("hist-notice").innerHTML = s.firstEvent
    ? `נתוני סוכנים וסקילים: מ-<b>${dm(s.firstEvent.date)}</b> (האירוע הראשון ביומן). חסימות: מ-<b>${s.blocks.firstDate ? dm(s.blocks.firstDate) : "—"}</b> (incidents.md, ואחר כך היומן). ימים לפני כן: ${NODATA}, לא אפס.`
    : "היומן עדיין ריק: אין נתוני סוכנים וסקילים. חסימות מוצגות רק מ-incidents.md.";
  $("hist-usage").innerHTML = `<h3>סוכנים</h3>${usageTable(s.usage.agents, "agent")}<h3>סקילים</h3>${usageTable(s.usage.skills, "skill")}`;
  $("hist-rounds").innerHTML = s.rounds.length
    ? `<p class="muted">מספר ריצות, לא "עד אישור" (ההכרעה אינה ביומן). חלק שמוזג ב-main נספר עד המיזוג האחרון שלו.</p>` +
      table([["חלק"], ["CRITIC", true], ["TEST ENGINEER", true], ["מיזוג אחרון"]], s.rounds.map(r =>
        `<tr><td><bdi>${esc(partLabel(r.feature, r.part))}</bdi></td><td class="n">${r.critic}</td><td class="n">${r.testEngineer}</td>
          <td>${r.mergedAt ? new Date(r.mergedAt).toLocaleDateString("he-IL") + (r.afterMerge ? ` · ${r.afterMerge} ריצות אחריו` : "") : "טרם מוזג"}</td></tr>`))
    : `<div class="empty">${NODATA}.</div>`;
  $("hist-blocks").innerHTML = renderBlocks(s);
  $("hist-timeline").innerHTML = renderTimeline(s);
}
async function loadHistory() {
  try {
    const r = await fetch(`/summary?days=${encodeURIComponent($("hist-range").value)}`);
    if (!r.ok) throw new Error(String(r.status));
    H.summary = await r.json();
    renderHistory();
  } catch {
    $("hist-notice").textContent = "לא ניתן לטעון את ההיסטוריה. מנסה שוב…";
  }
}
function setView(v) {
  $("view-live").hidden = v !== "live";
  $("view-history").hidden = v !== "history";
  for (const [id, name] of [["tab-live", "live"], ["tab-history", "history"]]) {
    if (v === name) $(id).setAttribute("aria-current", "page"); else $(id).removeAttribute("aria-current");
  }
  clearInterval(H.timer);
  if (v === "history") { renderHistory(); loadHistory(); H.timer = setInterval(loadHistory, 30000); }
}
$("tab-live").addEventListener("click", () => setView("live"));
$("tab-history").addEventListener("click", () => setView("history"));
$("hist-range").addEventListener("change", loadHistory);

function render() { renderLive(); }

$("toggle-old").addEventListener("click", () => { S.showOld = !S.showOld; render(); });

function connect() {
  const es = new EventSource("/events");
  es.addEventListener("init", e => {
    Object.assign(S, { sessions: new Map(), agents: new Map(), calls: new Map(), pending: [], skills: [], feed: [], tools: 0 });
    for (const ev of JSON.parse(e.data)) apply(ev);
    render();
  });
  es.addEventListener("events", e => { for (const ev of JSON.parse(e.data)) apply(ev); render(); });
  es.onopen = () => { $("dot").classList.add("on"); $("conn").textContent = "מחובר · חי"; };
  es.onerror = () => { $("dot").classList.remove("on"); $("conn").textContent = "מנותק — מנסה שוב…"; };
}
connect();
render();
setInterval(render, 2000); // the elapsed timers
</script>
</body>
</html>
